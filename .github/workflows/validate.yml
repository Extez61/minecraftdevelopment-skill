name: Validate skill suite
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate skills and local links
        run: python tools/validate_pack.py
      - name: Run unit and static tests
        run: python -m unittest discover -s tests
      - name: Check release files and hashes
        run: python tools/release_check.py --verify-manifest
